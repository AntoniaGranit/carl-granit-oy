#cloud-config
# Cloud-init configuration for carl-granit-oy server

# Update system packages on first boot
package_update: true
package_upgrade: true

# Install essential packages
packages:
  - curl
  - wget
  - git
  - nginx
  - ufw
  - certbot
  - python3-certbot-nginx
  - ca-certificates
  - gnupg
  - lsb-release
  - apt-transport-https
  - software-properties-common
  - python3
  - python3-pip
  - fail2ban
  - unattended-upgrades

# Write files
write_files:
  # Nginx configuration
  - path: /etc/nginx/sites-available/carl-granit-oy
    content: |
      server {
          listen 80;
          server_name _;
          
          location / {
              proxy_pass http://localhost:3000;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection 'upgrade';
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_cache_bypass $http_upgrade;
          }
          
          location /health {
              access_log off;
              return 200 "healthy\n";
              add_header Content-Type text/plain;
          }
      }
    owner: root:root
    permissions: '0644'
  
  # Docker installation script
  - path: /tmp/install-docker.sh
    content: |
      #!/bin/bash
      set -e
      set -x  # Enable debugging
      
      exec > >(tee -a /var/log/cloud-init-output.log) 2>&1
      echo "=== Starting Docker installation ==="
      
      # Wait for apt to be completely free (prerequisites from packages section should be installed by now)
      echo "Waiting for apt to be available..."
      while fuser /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock /var/lib/dpkg/lock >/dev/null 2>&1; do 
        sleep 2
      done
      
      # Install Docker using official get.docker.com script (most reliable method)
      echo "Installing Docker..."
      curl -fsSL https://get.docker.com -o /tmp/get-docker.sh
      sh /tmp/get-docker.sh
      rm -f /tmp/get-docker.sh
      
      # Install Docker Compose plugin
      echo "Installing Docker Compose plugin..."
      apt-get update -qq
      apt-get install -y -qq docker-compose-plugin
      
      # Enable and start Docker
      echo "Starting Docker service..."
      systemctl enable docker
      systemctl start docker
      
      # Wait for Docker daemon to be ready
      echo "Waiting for Docker daemon..."
      for i in {1..30}; do
        if docker ps &> /dev/null; then
          break
        fi
        sleep 1
      done
      
      # Verify installation
      if ! command -v docker &> /dev/null; then
        echo "ERROR: Docker command not found"
        exit 1
      fi
      
      if ! docker ps &> /dev/null; then
        echo "ERROR: Docker daemon is not running"
        systemctl status docker
        exit 1
      fi
      
      # Configure Docker with secure DNS settings
      mkdir -p /etc/docker
      cat > /etc/docker/daemon.json << 'DOCKEREOF'
{
  "log-driver": "json-file",
  "log-opts": {
    "max-size": "10m",
    "max-file": "3"
  },
  "dns": ["8.8.8.8", "8.8.4.4"],
  "dns-opts": ["timeout:2", "attempts:2"]
}
DOCKEREOF
      systemctl restart docker
      
      echo "Docker version: $(docker --version)"
      echo "Docker Compose: $(docker compose version 2>/dev/null || echo 'not found')"
      echo "=== Docker installation completed successfully ==="
    owner: root:root
    permissions: '0755'

# Run commands (sequential, not parallel)
runcmd:
  # Wait for package installation to complete and ensure apt is unlocked
  - while fuser /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock /var/lib/dpkg/lock >/dev/null 2>&1; do sleep 1; done
  # Install Docker (must run AFTER packages section completes)
  - /tmp/install-docker.sh
  
  # Configure firewall - block DNS ports to prevent amplification attacks
  - ufw --force enable
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow ssh
  - ufw allow 'Nginx Full'
  - ufw allow 3000/tcp
  - ufw deny 53/udp
  - ufw deny 53/tcp
  
  # Configure SSH for GitHub Actions
  - mkdir -p /root/.ssh
  - chmod 700 /root/.ssh
  - echo "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIH4fWu02RTTrcBh8xN6Uy5W/VY2+h00ubccvj/5HaUyk github-actions-deploy" >> /root/.ssh/authorized_keys
  - chmod 600 /root/.ssh/authorized_keys
  
  # Create application directory
  - mkdir -p /var/www/carl-granit-oy
  - chown -R root:root /var/www/carl-granit-oy
  
  # Configure nginx
  - ln -sf /etc/nginx/sites-available/carl-granit-oy /etc/nginx/sites-enabled/
  - rm -f /etc/nginx/sites-enabled/default
  
  # Configure DNS resolver with rate limiting
  - |
    cat > /etc/systemd/resolved.conf << 'RESOLVEDEOF'
[Resolve]
DNS=8.8.8.8 8.8.4.4
FallbackDNS=1.1.1.1 1.0.0.1
Cache=yes
DNSStubListener=yes
DNSSEC=allow-downgrade
ReadEtcHosts=yes
RESOLVEDEOF
  - systemctl restart systemd-resolved
  
  # Configure fail2ban
  - |
    cat > /etc/fail2ban/jail.local << 'FAIL2BANEOF'
[DEFAULT]
bantime = 3600
findtime = 600
maxretry = 5
destemail = root@localhost
sendername = Fail2Ban
action = %(action_)s

[sshd]
enabled = true
port = ssh
logpath = %(sshd_log)s
backend = %(sshd_backend)s
maxretry = 3
bantime = 7200
FAIL2BANEOF
  - systemctl enable fail2ban
  - systemctl start fail2ban
  
  # Test and start nginx
  - nginx -t
  - systemctl enable nginx
  - systemctl start nginx
  
  # Cleanup
  - rm -f /tmp/install-docker.sh
  
  # Log completion
  - echo "=== Server Setup Complete ===" >> /var/log/cloud-init-output.log
  - echo "Server IP: $(curl -s ifconfig.me)" >> /var/log/cloud-init-output.log
  - echo "Docker version: $(docker --version 2>/dev/null || echo 'not installed')" >> /var/log/cloud-init-output.log
  - echo "Nginx status: $(systemctl is-active nginx)" >> /var/log/cloud-init-output.log

# Boot commands (run before runcmd)
bootcmd:
  - echo "Starting cloud-init setup..." >> /var/log/cloud-init-output.log

# Final message
final_message: |
  Server setup completed at $UPTIME
  Check /var/log/cloud-init-output.log for details
