name: SSL Certificate Renewal

on:
  schedule:
    # Run every Monday at 2 AM UTC (checks if renewal is needed)
    - cron: "0 2 * * 1"
  workflow_dispatch:

env:
  DOMAIN: "carlgranitoy.com"

jobs:
  renew-ssl:
    runs-on: ubuntu-latest

    steps:
      - name: Check SSL certificate expiry
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ci
          key: ${{ secrets.CI_SSH_KEY }}
          script: |
            CERT_INFO=$(certbot certificates --domain ${{ env.DOMAIN }} 2>/dev/null)
            DAYS_UNTIL_EXPIRY=$(echo "$CERT_INFO" | grep -oP 'VALID: \K\d+' || echo "999")

            if [ "$DAYS_UNTIL_EXPIRY" -le 30 ]; then
              echo "Certificate expires in $DAYS_UNTIL_EXPIRY days (30 or less), attempting renewal..."
              
              if certbot renew --quiet --non-interactive; then
                echo "✅ SSL certificate renewed successfully!"
                
                systemctl reload nginx
                echo "✅ Nginx reloaded with new certificate"
                
                if curl -f https://${{ env.DOMAIN }} > /dev/null 2>&1; then
                  echo "✅ Site is accessible with new certificate"
                else
                  echo "❌ Site is not accessible after renewal"
                  exit 1
                fi
              else
                echo "❌ SSL certificate renewal failed"
                exit 1
              fi
            else
              echo "Certificate is still valid ($DAYS_UNTIL_EXPIRY days remaining), no renewal needed"
            fi

      - name: Notify renewal status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "🔒 SSL certificate renewal completed successfully"
          else
            echo "⚠️ SSL certificate renewal had issues - check logs"
          fi
